    note: Google Calculator.
  - name: com.google.android.tag
    category: preload
    risk: safe
    note: The NFC tag viewer app. NFC itself is a framework service and stays.
  - name: com.google.android.apps.wallpaper
    category: preload
    risk: safe
    note: The wallpaper picker. Wallpaper can still be set from an image in a gallery.

  # Held back from a default run: on this build each of these is the only thing
  # that handles what it handles.
  - name: com.google.android.apps.messaging
    category: preload
    risk: caution
    note: >
      Google Messages — and the device reports exactly one SMS handler, so this
      is it. Removing it leaves no way to read or send a text, which on a phone
      also means no SMS two-factor codes. Install another SMS app first if you
      want it gone.
  - name: com.google.android.dialer
    category: preload
    risk: caution
    note: >
      Google Phone — the only DIAL handler on this build (the AOSP dialer ships
      disabled). Removing it leaves no dialler UI; calls still work from a
      contact or an intent, but nothing puts a keypad on the screen.
  - name: com.google.android.contacts
    category: preload
    risk: caution
    note: >
      Google Contacts — the only contacts app here (the AOSP one ships
      disabled). Contact *data* is in the provider and the account and survives,
      but nothing displays or edits it afterwards.
  - name: com.android.chrome
    category: preload
    risk: caution
    note: >
      Chrome — the only browser on this build, so removing it leaves nothing to
      open a link with. Apps that render HTML inside themselves are unaffected:
      that is WebView, which is protected.
  - name: com.google.android.deskclock
    category: preload
    risk: caution
    note: Google Clock — the only alarm handler on this build. Alarms set in it go with it.
  - name: com.google.android.inputmethod.latin
    category: preload
    risk: caution
    note: >
      Gboard — effectively the only keyboard: the device lists a second IME, but
      it is the TTS voice input, which cannot type. Remove this without
      installing another keyboard first and the device has no way to enter text,
      including the text needed to install a keyboard.
  - prefix: com.google.android.googlequicksearchbox
    category: preload
    risk: caution
    note: The Google app — search, the search widget and Assistant. Removing it takes the assistant with it.
  - name: com.google.android.apps.googleassistant
    category: preload
    risk: caution
    note: Google Assistant. Voice control and any routine built on it stop working.
  - prefix: com.google.android.tts
    category: preload
    risk: caution
    note: >
      Google's text-to-speech engine. Accessibility tools, navigation prompts
      and read-aloud features depend on a TTS engine being present.
  - name: com.google.android.marvin.talkback
    category: preload
    risk: caution
    note: >
      TalkBack, the screen reader. It is the device's accessibility path for
      anyone who cannot see the screen — worth leaving unless you know nobody
      using this device needs it.
  - name: com.google.android.accessibility.switchaccess
    category: preload
    risk: caution
    note: Switch Access — accessibility input for users who cannot use a touchscreen directly.
  - name: com.google.android.apps.safetyhub
    category: preload
    risk: caution
    note: >
      Personal Safety — emergency SOS, car-crash detection and emergency
