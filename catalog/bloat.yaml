  # Identified by pulling the APK and reading its label: "Device Pulse", the
  # Smith Micro diagnostics and self-service agent, not the activation plumbing
  # the package name suggests. It was protected on that guess; a label is worth
  # more than a package name, so it is now offered — in its own category, never
  # by default, because a self-service agent may still be part of how TracFone
  # support reaches the device.
  - prefix: com.tracfone.preload.accountservices
    category: carrier
    risk: invasive
    blocked: true
    note: >
      "Device Pulse" — TracFone/Smith Micro device diagnostics and self-service
      agent. It reports device state to the carrier and backs in-app support
      flows.

      This build will not part with it: both `pm uninstall --user 0` and
      `pm disable-user` answer "package is non-disable", the same
      protected-packages refusal com.motorola.paks gives. It is a PRIVILEGED
      PRODUCT app and an UPDATED_SYSTEM_APP, so an OTA has replaced it at least
      once. Reported rather than proposed; root or a modified image is the only
      route, and on a device kept for its carrier service that is a poor trade.
