# Preloaded packages a phone can lose, as `unbrick adb debloat` reads them.
#
# Every removal this drives is `pm uninstall --user 0`: a per-user state change
# that touches no partition, leaves dm-verity and the bootloader lock alone, and
# is undone by `unbrick adb debloat --restore` or by a factory reset. Nothing
# here is a flash, and nothing here needs root or an unlocked bootloader.
#
# Entries were read off a real device, not a forum list: a Moto G Play 2024
# (fogona, XT2413V) on the TracFone channel, Android 14 U1TF34.100-35-14. A
# package this file does not name is reported as *unknown* and never proposed —
# guessing across 461 packages is how a phone loses its modem. `--list` prints
# the unknowns so this table can grow from evidence.
#
# `category` decides whether a package is offered and under which flag:
#   ads             - the delivery machinery that installs sponsored apps
#   preload         - third-party apps the channel shipped
#   carrier-foreign - another carrier's client on this unit
#   oem-extra       - the manufacturer's optional software
#   updates         - the OTA machinery; removing it stops security updates
#   protected       - never offered, whatever the flags
# `risk` is what a removal costs: safe (nothing a stock phone relies on),
# caution (a named feature goes away), invasive (activation, updates or a
# carrier feature may be affected).
#
# `vendor` scopes an entry to one OEM's devices, as a catalog vendor id. Every
# com.motorola.* entry below carries `vendor: motorola`, because a rule about a
# package the maintainer has only ever seen on a Motorola cannot vouch for
# anything on a Samsung: out of scope, it is dropped and the package falls to
# "unknown", which is the honest answer. Entries with no `vendor` are the ones
# that are genuinely everyone's — the Android platform, Google's packages, the
# delivery agents, the games, and a carrier's own apps (a carrier ships those
# across OEMs, so they are scoped by carrier in practice, not by vendor).
#
# Telephony, IMS, provisioning, setup and the carrier-unlock client are
# protected in code (internal/bloat), not here, so editing this file cannot
# unprotect them. This file may add protections and name bloat.
#
# NOTE on this unit's network: TracFone is a Verizon MVNO, so the Verizon APN and
# provisioning packages on it are plausibly *live* rather than foreign. They are
# protected below for that reason; the myVerizon app itself is not.

bloat:
  # ── ads: the delivery agents ───────────────────────────────────────────────
  # Worth more than what they deliver: removing the agent stops re-delivery
  # after a reset, which is why the games come back otherwise.
  - prefix: com.aura.
    category: ads
    risk: safe
    note: >
      Aura/ironSource preload delivery (oobe.motorola, oobe.solutions, jet.att,
      appadvisor.*): installs sponsored apps during setup and recommends more
      afterwards. Nothing on the phone depends on it.
  - name: com.dti.tracfone
    category: ads
    risk: safe
    note: Digital Turbine Ignite for TracFone — the sponsored-app installer behind the preloaded games.
  - name: com.motorola.appforecast
    vendor: motorola
    category: ads
    risk: safe
    note: App recommendation/prediction service that feeds preload suggestions.
  - name: com.motorola.discovery
    vendor: motorola
    category: ads
    risk: safe
    note: Motorola content/app discovery feed.
  - prefix: com.motorola.paks
    vendor: motorola
    category: ads
    risk: safe
    blocked: true
    note: >
      Motorola preload delivery ("paks") and its notifications. This build lists
      them as protected packages: `pm uninstall --user 0` answers
      DELETE_FAILED_INTERNAL_ERROR and `pm disable-user` answers
      "SecurityException: Cannot disable a protected package", so nothing short
      of root or a modified image removes them. Reported, not proposed.
  - name: com.motorola.brapps
    vendor: motorola
    category: ads
    risk: safe
    note: Motorola preload app bundle installer.
  - name: com.amazon.appmanager
    category: ads
    risk: safe
    note: >
      Amazon's preload installer stub. Ships disabled on the observed unit, and
      a disabled privileged package refuses uninstall ("package is
      non-disable") — already-disabled packages are reported, not proposed.
  - name: com.swishme.tracfone
    category: ads
    risk: safe
    note: '"Swish Deals" — a TracFone offers/deals app that notifies for sponsored content.'
  - prefix: com.facebook.appmanager
    category: ads
    risk: safe
    note: Facebook's preload installer; keeps the Facebook stubs up to date whether or not the app is used.
  - name: com.facebook.services
    category: ads
    risk: safe
    note: Facebook background services stub — runs without the Facebook app installed.
  - name: com.facebook.system
    category: ads
    risk: safe
    note: Facebook system stub — runs without the Facebook app installed.

  # ── Google's apps ────────────────────────────────────────────────────────
  # Unscoped by vendor: these ship on every Android device with Play services,
  # so they are nobody's OEM extras. Google's *platform* half — WebView, the
  # permission controller, the media provider, the mainline modules, emergency
  # alerts, carrier services — is protected in code (internal/bloat), not here:
  # removing one of those is removing a piece of the operating system.
  #
  # The `caution` entries below were decided by asking the device what else
  # handles the same intent, not by taste. On the observed unit: one SMS
  # handler, one dialer, one browser, one alarm handler, and one real keyboard
  # (Gboard — the second IME is the TTS voice input, which cannot type). Those
  # are capabilities nothing else exposes, so they are held back from a default
  # run even though every one of them is reinstallable from Play.
  - prefix: com.google.android.apps.youtube.music
    category: preload
    risk: safe
    note: YouTube Music, and its setup-wizard hook. Reinstallable from the Play Store.
  - name: com.google.android.youtube
    category: preload
    risk: safe
    note: YouTube. Reinstallable from the Play Store.
  - name: com.google.android.videos
    category: preload
    risk: safe
    note: Google TV / Play Movies. Reinstallable from the Play Store.
  - name: com.google.android.apps.docs
    category: preload
    risk: safe
    note: Google Drive. Reinstallable from the Play Store.
  - name: com.google.android.gm
    category: preload
    risk: safe
    note: Gmail. Reinstallable from the Play Store.
  - name: com.google.android.calendar
    category: preload
    risk: safe
    note: Google Calendar. Calendar *data* lives in the provider and the account, not in this app.
  - name: com.google.android.apps.tachyon
    category: preload
    risk: safe
    note: Google Meet (formerly Duo). Reinstallable from the Play Store.
  - name: com.google.android.apps.nbu.files
    category: preload
    risk: safe
    note: Files by Google. The system file picker (DocumentsUI) is a protected package and stays.
  - name: com.google.android.apps.chromecast.app
    category: preload
    risk: safe
    note: Google Home. Reinstallable from the Play Store.
  - name: com.google.android.apps.maps
    category: preload
    risk: safe
    note: Google Maps. Reinstallable from the Play Store — but check you have another way to navigate before a trip.
  - name: com.google.android.apps.photos
    category: preload
    risk: safe
    note: >
      Google Photos. Safe here because the device reports two handlers for
      viewing an image, so a gallery remains; photos themselves live in shared
      storage and in the account, not in this app. On a device where it is the
      only gallery this would be `caution`.
  - name: com.google.android.apps.wellbeing
    category: preload
    risk: safe
    note: Digital Wellbeing — screen-time reporting and its parental-control hooks.
  - name: com.google.android.projection.gearhead
    category: preload
    risk: safe
    note: Android Auto. Useless without a head unit, and reinstallable if one appears.
  - name: com.google.android.printservice.recommendation
    category: preload
    risk: safe
    note: Suggests printer plugins to install. Printing itself is a framework service and stays.
  - name: com.google.android.feedback
    category: preload
    risk: safe
    note: The "send feedback to Google" hook.
  - name: com.google.android.apps.restore
    category: preload
    risk: safe
    note: Restores data from another device during setup. Does nothing after setup, and comes back with a reset.
  - name: com.google.android.onetimeinitializer
    category: preload
    risk: safe
    note: A one-shot first-boot initialiser. Already done its work on a device that is running.
  - name: com.google.android.calculator
    category: preload
