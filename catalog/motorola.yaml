# Motorola-specific reference data (CID, carrier, OTA software channel). These are
# Motorola schemes — a CID or a channel code means nothing on another vendor — so
# they live under vendor_data.motorola and the catalog serves them only when the
# device's driver is Motorola (Driver.ID() == "motorola"). Other vendors add their
# own vendor_data block; nothing here is shared.
vendor_data:
  motorola:
    # CID — `fastboot getvar cid`, a 16-bit hex value (0x0032). ABL reads it from the
    # factory-provisioned `cid` partition (partitions.yaml: identity, irreplaceable),
    # so it survives flashing and identifies the carrier / subsidy channel the unit
    # was built for. It is the package-matching key: a retail package declares its
    # target in flashfile.xml as `<cid_value value="0x0032"/>`, and a package whose
    # cid_value does not match the device's CID is refused. Every carrier_ids entry is
    # read off an observed package; unattested CIDs stay absent rather than guessed,
    # and an entry says only what every observation of that CID agrees on (below).
    # Keys are decimal, matching the `cidNN` filename token (0x0032 -> 50). Ingest
    # harvests cid_value into each stock build's meta.json, so library.CarrierIDs() is
    # the standing evidence; recon falls back to it for a CID this file does not name.
    # A CID is NOT a channel name, and an entry here must not read as one. Two
    # observed fogona packages both declare cid_value 0x0032 and disagree about
    # everything else: XT2413-2_FOGONA_RETUS_..._subsidy-DEFAULT (manifest:
    # subsidy none, retail) and XT2413-2_FOGONA_CC_..._subsidy-CCAWS (manifest:
    # subsidy LOCKED to T-Mobile/AT&T). So the CID is the package-matching key
    # the bootloader compares — per model and region — while the channel and the
    # subsidy lock are per *package*. Name only what the observations share, and
    # leave the lock to the subsidy_lock fact, which is read from the slcf the
    # package actually carries. Labelling 0x0032 with a subsidy lock made recon
    # print "subsidy lock CCAWS" over a RETUS package whose own manifest said
    # "Subsidy: none (retail)" — a contradiction inside one report.
    carrier_ids:
      # cid_value 0x0032, observed on two XT2413-2 (Retail region) packages:
      #   XT2413-2_FOGONA_RETUS_14_U1TFS34.100-35-14-1-4_subsidy-DEFAULT_...
      #   XT2413-2_FOGONA_CC_14_U1TF34.100-35_subsidy-CCAWS_..._R4_CFC
      50: "US retail (XT2413-2; seen on RETUS and CC packages)"
      # cid_value 0x0033, observed on two TracFone/Visible packages:
      #   XT2413V_FOGONA_TRACFONE_14_U1TFS34.100-35-14-1-4_subsidy-TRAC_VISIBLE_RSU_...
      #   FOGONA_G_U1TFS34.100-35-14-1-21_subsidy-TRAC_VISIBLE_RSU_...
      51: "TracFone / Visible (XT2413V)"

    # Motorola's own list of the CIDs whose devices the unlock portal will serve,
    # posted by Motorola support on the Lenovo developer forum:
    # https://forums.lenovo.com/t5/MOTOROLA-Android-Developer/Bootloader-Unlock-Problems/m-p/3222809
    # Closed-world: a CID absent from this list is a predicted refusal, not an unknown
    # (unlike carrier_ids). A dated-less vendor claim, corroborated by two devices so
    # far: 0x0032 (listed) unlocks; 0x0033 (absent) ships a carrier subsidy lock.
    unlock_eligible_cids:
      [0x0000, 0x0003, 0x0007, 0x0009, 0x000B, 0x000C, 0x000D, 0x000E, 0x0014, 0x0015, 0x00DE, 0x0032]

    # CID meanings from a Motorola community post (2022-09-15), trusted for now but
    # not independently attested from a package in this corpus. Kept apart from the
    # package-attested carrier_ids (which carries subsidy-lock detail): recon uses this
    # only when carrier_ids and the library have nothing, so where they agree the
    # attested entry wins. Super-permission and 0xDEAD are states the post documents.
    # 0x0032/0x0033 are intentionally omitted: carrier_ids already names them with
    # subsidy-lock detail and always wins, so a reference row for them is dead weight.
    cid_reference:
      2: "Verizon"                              # 0x0002
      18: "Amazon / AT&T / Cricket"             # 0x0012
      21: "T-Mobile / Boost"                    # 0x0015
      0: "super-permission (any-region firmware, same model)"    # 0x0000
      255: "factory super-permission (factory firmware only)"    # 0x00FF
      57005: "corrupt / unreadable CID"         # 0xDEAD

    # OTA software channel (carrier update branch; the SKU token in package names,
    # e.g. RETUS). Picks which official build a unit takes, distinct from the CID.
    # Forum-sourced (2022-09-15), trusted for now, not attested against this corpus.
    # Deprecated lanes (merged into a survivor) are kept for reading old packages,
    # with the merge target noted. Keys are channel codes; lookup is case-insensitive.
    software_channels:
