# Firmware a Qualcomm SoC's remote processors load whatever the board. A file
# "a|b" is satisfied by either name: some kernels ask for .mbn where a vendor
# partition carries .mdt (and its .bNN segments). Board parts' own firmware is
# listed on their dt_parts entry.
fw_subsystems:
  - {name: adsp,       files: ["adsp.mbn|adsp.mdt"]}
  - {name: cdsp,       files: ["cdsp.mbn|cdsp.mdt"]}
  - {name: modem,      files: ["modem.mbn|modem.mdt"]}
  - {name: ipa,        files: ["ipa_fws.mbn|ipa_fws.mdt"]}
  - {name: video,      files: ["venus.mbn|venus.mdt"]}
  - {name: wifi,       files: ["wlanmdsp.mbn"]}
