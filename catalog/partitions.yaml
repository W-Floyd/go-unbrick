# Protected Partition Catalog & Safeguard Rules
# Defines per-device calibration, radio NVRAM, and identity partitions across
# Qualcomm, MediaTek, and Samsung platforms.
#
# Criticality:
#   irreplaceable: Unique per-device hardware keys, IMEI, RF calibration, baseband tuning.
#                  If erased or overwritten, causes permanent radio failure or hardware brick.
#   important:     Factory calibration, sensors, carrier provisioning, customer ID, FRP locks.
#   replaceable:   Generic vendor/stock bootloader binaries that can be safely flashed.

partitions:
  # --- Radio / Baseband / NVRAM / IMEI (Irreplaceable) ---
  modemst1:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: qualcomm
    description: "Primary modem NVRAM (IMEI, SIM lock, baseband calibration)"
  modemst2:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: qualcomm
    description: "Secondary modem NVRAM (IMEI backup, network profiles)"
  fsg:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: qualcomm
    description: "Golden copy of modem file system (radio parameters)"
  fsc:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: qualcomm
    description: "Modem filesystem cookies and encryption keys"
  nvram:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: mediatek
    description: "MediaTek baseband NVRAM (IMEI, RF calibration, MAC addresses)"
  nvdata:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: mediatek
    description: "MediaTek dynamic NVRAM data partition"
  proinfo:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: mediatek
    description: "MediaTek factory product information and barcode/serial"
  protect1:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: mediatek
    description: "MediaTek protected calibration partition 1"
  protect2:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: mediatek
    description: "MediaTek protected calibration partition 2"
  nvcfg:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: mediatek
    description: "MediaTek non-volatile carrier configuration"
  efs:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: samsung
    description: "Samsung encrypted filesystem (IMEI, MAC, baseband NV)"
  sec_efs:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: samsung
    description: "Samsung secondary secure EFS backup"
  nv_data:
    category: radio
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: samsung
    description: "Samsung baseband NVRAM data"

  # --- Sensor & Factory Calibration ---
  persist:
    category: calibration
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: qualcomm
    description: "Factory sensor, camera, audio, display and DRM calibration"
  prodpersist:
    category: calibration
    criticality: irreplaceable
    action: backup_and_preserve
    vendor: motorola
    description: "Motorola production persist partition (factory test results & calibration)"
  sns:
    category: calibration
    criticality: important
    action: backup_and_preserve
    vendor: qualcomm
    description: "Sensor subsystem hardware calibration"
  sensorhub:
    category: calibration
    criticality: important
    action: backup_and_preserve
    vendor: qualcomm
    description: "Context hub / sensor fusion calibration"
  kpan:
    category: calibration
    criticality: important
    action: backup_and_preserve
    vendor: motorola
    description: "Motorola kernel panic & diagnostic calibration logs"
  carrier:
    category: calibration
    criticality: important
    action: backup_and_preserve
    vendor: generic
    description: "Carrier specific customization and APN provisioning"

